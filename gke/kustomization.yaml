apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../redis
- ../rustfs
- ../rest
- ../worker
- rest-backend.yaml
images:
- name: demucs-rest
  newName: REGISTRY/demucs-rest
  newTag: gke-v1
- name: demucs-worker
  newName: REGISTRY/demucs-worker
  newTag: gke-v1
patches:
- path: ingress-patch.yaml
- path: service-patch.yaml
- target:
    kind: PersistentVolumeClaim
    name: rustfs-data
  patch: |-
    - op: replace
      path: /spec/resources/requests/storage
      value: 10Gi
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
- target:
    kind: PersistentVolumeClaim
    name: demucs-models
  patch: |-
    - op: replace
      path: /spec/resources/requests/storage
      value: 10Gi
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
