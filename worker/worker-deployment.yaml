apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demucs-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: demucs-worker:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: RUSTFS_ENDPOINT
          value: http://rustfs:9000
        envFrom:
        - secretRef:
            name: rustfs-credentials
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            memory: 8Gi
        volumeMounts:
        - name: models
          mountPath: /models
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: demucs-models
